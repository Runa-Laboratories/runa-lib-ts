name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact package version to admit, sign, and publish
        required: true
        type: string
      candidate_run_id:
        description: Successful main CI run containing npm-release-candidate
        required: true
        type: string
      authority_run_id:
        description: Successful independent authority run containing signed release evidence
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: release-${{ github.repository }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  phase-a:
    name: phase-a-pre-tag
    runs-on: ubuntu-22.04
    outputs:
      filename: ${{ steps.candidate.outputs.filename }}
      authority_repository: ${{ steps.authority.outputs.repository }}
      authority_artifact: ${{ steps.authority.outputs.artifact }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.17.1
      - run: npm install --global npm@10.9.2
      - run: npm ci
      - name: Validate protected source and requested version
        env:
          RUNA_REQUESTED_VERSION: ${{ inputs.version }}
        run: node -e "const p=require('./package.json');if(process.env.GITHUB_REF!=='refs/heads/main'||process.env.RUNA_REQUESTED_VERSION!==p.version)process.exit(1)"
      - name: Validate selected CI run
        run: node scripts/verify-ci-run.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          RUNA_CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
      - name: Require public provenance-capable release context
        run: npm run release:context:verify
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Require accepted independent authority configuration
        id: authority
        run: npm run release:authority:config:verify
      - name: Verify independent authority run identity before tagging
        run: npm run release:authority:run:verify
        env:
          GH_TOKEN: ${{ secrets.RUNA_AUTHORITY_READ_TOKEN }}
          RUNA_AUTHORITY_RUN_ID: ${{ inputs.authority_run_id }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: npm-release-candidate
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
      - name: Validate downloaded candidate identity
        env:
          RUNA_REQUESTED_VERSION: ${{ inputs.version }}
        run: node -e "const c=require('./release-artifacts/candidate.json');if(c.source_commit!==process.env.GITHUB_SHA||c.version!==process.env.RUNA_REQUESTED_VERSION||c.source_tree_clean!==true)process.exit(1)"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: ${{ steps.authority.outputs.repository }}
          name: ${{ steps.authority.outputs.artifact }}
          path: authority-preflight
          run-id: ${{ inputs.authority_run_id }}
          github-token: ${{ secrets.RUNA_AUTHORITY_READ_TOKEN }}
      - name: Verify non-approval authority evidence and bindings before tagging
        run: npm run release:authority:import
        env:
          RUNA_AUTHORITY_PREFLIGHT: '1'
          RUNA_AUTHORITY_INPUT_DIR: authority-preflight
      - name: Verify all local non-approval gates before tagging
        run: npm run release:pretag:verify
      - id: candidate
        run: echo "filename=$(node -p 'require(\"./release-artifacts/candidate.json\").filename')" >> "$GITHUB_OUTPUT"
      - name: Pre-tag registry absence check
        run: npm run release:registry:preflight

  sign-tag:
    needs: phase-a
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version: '1.25.9'
          cache: false
      - name: Install pinned gitsign
        run: |
          mkdir -p "$RUNNER_TEMP/gitsign-bin"
          GOBIN="$RUNNER_TEMP/gitsign-bin" go install github.com/sigstore/gitsign@v0.16.0
          echo "$RUNNER_TEMP/gitsign-bin" >> "$GITHUB_PATH"
      - name: Create and verify immutable release tag
        env:
          GITSIGN_TOKEN_PROVIDER: github-actions
          RUNA_RELEASE_TAG: ts-v${{ inputs.version }}
        run: |
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          test -z "$(git ls-remote --tags origin "refs/tags/$RUNA_RELEASE_TAG")"
          git config --local gpg.format x509
          git config --local gpg.x509.program gitsign
          git tag -s -m "Release $RUNA_RELEASE_TAG" "$RUNA_RELEASE_TAG" "$GITHUB_SHA"
          gitsign verify \
            --certificate-identity=https://github.com/Runa-Laboratories/runa-lib-ts/.github/workflows/release.yml@refs/heads/main \
            --certificate-oidc-issuer=https://token.actions.githubusercontent.com \
            "$RUNA_RELEASE_TAG"
          git push origin "refs/tags/$RUNA_RELEASE_TAG"

  admission:
    name: release-admission
    needs: [phase-a, sign-tag]
    runs-on: ubuntu-22.04
    environment: release-evidence
    outputs:
      filename: ${{ steps.candidate.outputs.filename }}
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: refs/tags/ts-v${{ inputs.version }}
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version: '1.25.9'
          cache: false
      - name: Install pinned gitsign
        run: |
          mkdir -p "$RUNNER_TEMP/gitsign-bin"
          GOBIN="$RUNNER_TEMP/gitsign-bin" go install github.com/sigstore/gitsign@v0.16.0
          echo "$RUNNER_TEMP/gitsign-bin" >> "$GITHUB_PATH"
      - name: Verify immutable tag before authority retrieval
        run: node scripts/verify-release-tag.mjs
        env:
          RUNA_RELEASE_TAG: ts-v${{ inputs.version }}
          RUNA_RELEASE_COMMIT: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.17.1
      - run: npm install --global npm@11.19.0
      - run: npm ci
      - name: Verify independent authority run identity
        run: npm run release:authority:run:verify
        env:
          GH_TOKEN: ${{ secrets.RUNA_AUTHORITY_READ_TOKEN }}
          RUNA_AUTHORITY_RUN_ID: ${{ inputs.authority_run_id }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: ${{ needs.phase-a.outputs.authority_repository }}
          name: ${{ needs.phase-a.outputs.authority_artifact }}
          path: authority-input
          run-id: ${{ inputs.authority_run_id }}
          github-token: ${{ secrets.RUNA_AUTHORITY_READ_TOKEN }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: npm-release-candidate
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
      - name: Validate downloaded candidate identity
        env:
          RUNA_REQUESTED_VERSION: ${{ inputs.version }}
        run: node -e "const c=require('./release-artifacts/candidate.json');if(c.source_commit!==process.env.GITHUB_SHA||c.version!==process.env.RUNA_REQUESTED_VERSION||c.source_tree_clean!==true)process.exit(1)"
      - run: npm run release:authority:import
      - id: candidate
        run: echo "filename=$(node -p 'require(\"./release-artifacts/candidate.json\").filename')" >> "$GITHUB_OUTPUT"
      - run: npm run release:readiness
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: admitted-npm-release-candidate
          path: |
            release-artifacts/
            evidence/
          if-no-files-found: error

  publish:
    needs: admission
    runs-on: ubuntu-22.04
    environment: npm
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: refs/tags/ts-v${{ inputs.version }}
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version: '1.25.9'
          cache: false
      - name: Install pinned gitsign
        run: |
          mkdir -p "$RUNNER_TEMP/gitsign-bin"
          GOBIN="$RUNNER_TEMP/gitsign-bin" go install github.com/sigstore/gitsign@v0.16.0
          echo "$RUNNER_TEMP/gitsign-bin" >> "$GITHUB_PATH"
      - name: Verify admitted tag identity
        run: node scripts/verify-release-tag.mjs
        env:
          RUNA_RELEASE_TAG: ts-v${{ inputs.version }}
          RUNA_RELEASE_COMMIT: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.17.1
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11.19.0
      - run: npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: admitted-npm-release-candidate
      - run: node -e "const fs=require('node:fs');const c=require('./release-artifacts/candidate.json');const h=require('node:crypto').createHash('sha256').update(fs.readFileSync('./release-artifacts/'+c.filename)).digest('hex');if(h!==c.sha256)process.exit(1)"
      - id: mapping
        run: node scripts/resolve-release-channel.mjs
      - run: npm run release:registry:preflight
      - id: attest
        # v4, resolved from the official annotated tag on 2026-08-02.
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373
        with:
          subject-path: release-artifacts/${{ needs.admission.outputs.filename }}
      - run: npm publish "release-artifacts/${{ needs.admission.outputs.filename }}" --provenance --access public --registry https://registry.npmjs.org/ --tag "${{ steps.mapping.outputs.dist_tag }}"
      - run: npm run release:postpublish:verify
        env:
          RUNA_ATTESTATION_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          GH_TOKEN: ${{ github.token }}
      - if: failure()
        run: npm run release:recovery:plan
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: npm-postpublish-receipts
          path: |
            evidence/*.intoto.jsonl
            evidence/postpublish-receipt.json
            evidence/release-recovery-plan.json
          if-no-files-found: warn
