name: Release

on:
  push:
    tags: ["ts-v*"]

permissions:
  contents: read

jobs:
  admission:
    runs-on: ubuntu-22.04
    outputs:
      filename: ${{ steps.candidate.outputs.filename }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.17.1
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@10.9.2
      - run: npm ci
      - run: npm run quality
      - run: node scripts/record-quality-gate.mjs
      - run: npm run release:candidate
      - id: candidate
        run: echo "filename=$(node -p 'require(\"./release-artifacts/candidate.json\").filename')" >> "$GITHUB_OUTPUT"
      - run: npm run release:readiness
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: npm-release-candidate
          path: |
            release-artifacts/
            evidence/
          if-no-files-found: error

  publish:
    needs: admission
    runs-on: ubuntu-22.04
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.17.1
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@10.9.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: npm-release-candidate
      - run: node -e "const fs=require('node:fs');const c=require('./release-artifacts/candidate.json');const h=require('node:crypto').createHash('sha256').update(fs.readFileSync('./release-artifacts/'+c.filename)).digest('hex');if(h!==c.sha256)process.exit(1)"
      - run: npm publish "release-artifacts/${{ needs.admission.outputs.filename }}" --provenance --access public
