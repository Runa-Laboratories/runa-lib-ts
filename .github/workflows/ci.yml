name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  candidate:
    name: ts-quality-gates
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.4.1
          cache: npm
      - run: npm install --global npm@11.4.2
      - run: npm ci
      - run: npm run quality
      - run: npm run release:candidate
      - name: Install checksum-pinned CycloneDX CLI
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/cyclonedx-bin"
          curl --proto '=https' --tlsv1.2 --location --fail --show-error --output "$RUNNER_TEMP/cyclonedx-bin/cyclonedx-cli" "https://github.com/CycloneDX/cyclonedx-cli/releases/download/v0.32.0/cyclonedx-linux-x64"
          echo "454879e6a4a405c8a13bff49b8982adcb0596f3019b26b0811c66e4d7f0783e1  $RUNNER_TEMP/cyclonedx-bin/cyclonedx-cli" | sha256sum --check --strict
          chmod 0555 "$RUNNER_TEMP/cyclonedx-bin/cyclonedx-cli"
          echo "RUNA_CYCLONEDX_CLI=$RUNNER_TEMP/cyclonedx-bin/cyclonedx-cli" >> "$GITHUB_ENV"
      - run: npm run release:local-gates
      - run: npm run release:smoke
      - run: node scripts/record-quality-gate.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: npm-release-candidate-base
          path: |
            release-artifacts/
            evidence/
          if-no-files-found: error

  compatibility:
    needs: candidate
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, node: 22.17.1, npm: 10.9.2, id: ts050-node22-linux-x64 }
          - { os: windows-2022, node: 22.17.1, npm: 10.9.2, id: ts050-node22-windows-x64 }
          - { os: macos-14, node: 22.17.1, npm: 10.9.2, id: ts050-node22-macos-arm64 }
          - { os: ubuntu-22.04, node: 24.4.1, npm: 11.4.2, id: ts050-node24-linux-x64 }
          - { os: windows-2022, node: 24.4.1, npm: 11.4.2, id: ts050-node24-windows-x64 }
          - { os: macos-14, node: 24.4.1, npm: 11.4.2, id: ts050-node24-macos-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm install --global npm@${{ matrix.npm }}
      - run: npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: npm-release-candidate-base
      - run: npm run compatibility:verify
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: compatibility-${{ matrix.id }}
          path: evidence/compatibility-receipts/${{ matrix.id }}.json
          if-no-files-found: error

  release-admission:
    name: release-admission
    needs: [candidate, compatibility]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.17.1
      - run: npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: npm-release-candidate-base
      - run: npm run release:ci:admission

  handoff:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [compatibility, release-admission]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.17.1
      - run: npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: npm-release-candidate-base
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: compatibility-*
          path: evidence/compatibility-receipts
          merge-multiple: true
      - run: npm run compatibility:aggregate
        env:
          RUNA_COMPAT_SIGNING_KEY_ID: ${{ vars.RUNA_COMPAT_SIGNING_KEY_ID }}
          RUNA_COMPAT_SIGNING_KEY_PEM: ${{ secrets.RUNA_COMPAT_SIGNING_KEY_PEM }}
      - id: attest
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d
        with:
          subject-path: release-artifacts/*.tgz
      - name: Verify controlled-build provenance through GitHub verifier
        run: npm run release:provenance:verify
        env:
          GH_TOKEN: ${{ github.token }}
          RUNA_ATTESTATION_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
      - name: Retain exact controlled-build provenance
        run: npm run release:provenance:evidence
        env:
          RUNA_ATTESTATION_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          RUNA_ATTESTATION_ID: ${{ steps.attest.outputs.attestation-id }}
          RUNA_ATTESTATION_URL: ${{ steps.attest.outputs.attestation-url }}
      - run: npm run release:manifest:core
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: npm-release-candidate
          path: |
            release-artifacts/
            evidence/
          if-no-files-found: error
