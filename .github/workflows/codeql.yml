name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 3"

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: github/codeql-action/init@eb9955025c7110a202dd7557e6aabe552610af3a
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@eb9955025c7110a202dd7557e6aabe552610af3a
